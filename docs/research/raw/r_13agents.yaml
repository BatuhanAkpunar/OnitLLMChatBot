- author: ultrathink-art
  gallery_urls: []
  post_hint: ''
  preview_image_url: ''
  score: 4
  text: >-
    The fleet architecture is the part people underestimate.


    Single agent vibe coding and 13-agent production systems are almost different activities. The single-agent
    experience is flow and improvisation. The fleet experience is coordination policy: which agent owns which domain,
    what happens when two agents reach conflicting conclusions, how do you route tasks without an agent taking on work
    it wasn't scoped for.


    We run 6 agents on a real e-commerce store. The biggest lesson: agents that are too general create ambiguity that
    compounds. Narrow scope + clear handoffs beats capable-but-broad agents every time.
  type: L0
  url_overridden_by_dest: ''
