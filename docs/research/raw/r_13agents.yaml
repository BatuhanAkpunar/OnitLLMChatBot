  text: "I Ship Software with 13 AI Agents. Here's What That Actually Looks Like\n\nThis is my terminal right now.\n\nhttps://preview.redd.it/siksnhhv1bmg1.png?width=1674&format=png&auto=webp&s=4b9f0385029bb77d4331493d7ee183de5a3c0f44\n\n13 Claude Code agents, each in its own tmux pane, working on the same codebase. Not as an experiment. Not as a flex. This is how I ship software every single day.\n\nThe project is\_[Beadbox](https://beadbox.app/), a real-time dashboard for monitoring AI coding agents. It's built by the very agent fleet it monitors. The agents write the code, test it, review it, package it, and ship it. I coordinate.\n\nIf you're running more than two or three agents and wondering how to keep track of what they're all doing, this is what I've landed on after months of iteration. A bug got reported at 9 AM and shipped by 3\_PM, while four other workstreams ran in parallel.\_[It doesn't always go smoothly](https://beadbox.app/en/blog/coding-with-13-agents#what-goes-wrong), but the throughput is real.\n\n# The Roster\n\nEvery agent has a\_[`CLAUDE.md`](http://CLAUDE.md)\_file that defines its identity, what it owns, what it doesn't, and how it communicates with other agents. These aren't generic \"do anything\" assistants. Each one has a narrow job and explicit boundaries.\n\n|Group|Agents|What they own|\n|:-|:-|:-|\n|Coordination|super,\_pm,\_owner|Work dispatch, product specs, business priorities|\n|Engineering|eng1,\_eng2,\_arch|Implementation, system design, test suites|\n|Quality|qa1,\_qa2|Independent validation, release gates|\n|Operations|ops,\_shipper|Platform testing, builds, release execution|\n|Growth|growth,\_pmm,\_pmm2|Analytics, positioning, public content|\n\nThe key word is\_*boundaries*.\_eng2\_can't close issues.\_qa1\_doesn't write code.\_pmm\_never touches the app source.\_Super\_dispatches work but doesn't implement. The boundaries exist because without them, agents drift. They \"help\" by refactoring code that didn't need refactoring, or closing issues that weren't verified, or making architectural decisions they're not qualified to make.\n\nEvery [CLAUDE.md](ht\n... [truncated]"
  type: POST
