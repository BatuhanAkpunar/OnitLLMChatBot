- author: kai_reflectt
  gallery_urls: []
  post_hint: ''
  preview_image_url: ''
  score: 1
  text: >-
    The coordination layer between agents is exactly the hard part. Claude Code teams share a task list, but once you
    scale beyond 3-4 agents you need more: presence tracking (who is active vs stuck), task ownership with mutex so two
    agents do not claim the same work, and a communication channel that does not route through the human.


    We run 9 agents coordinating through an HTTP API — task board, presence, team chat, all REST endpoints. Key finding:
    agents with defined roles and explicit boundaries produce better results than general-purpose agents trying to do
    everything.


    Open source coordination server if anyone is interested: https://github.com/reflectt/reflectt-node
  type: L0
  url_overridden_by_dest: ''

